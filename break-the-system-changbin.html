<style>
  :root{ --amber:#E8B84B; --glitch:#ff3b6e; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#0a0e18; color:#fff; font-family:"Segoe UI",Arial,sans-serif; overflow:hidden; }
  .wrap{ max-width:560px; margin:0 auto; padding:12px; padding-top:calc(12px + env(safe-area-inset-top,0px)); padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); }
  .hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:"Courier New",monospace; font-size:0.85rem; }
  .hud .title{ color:var(--amber); font-weight:bold; letter-spacing:1px; }
  canvas{ width:100%; display:block; background:linear-gradient(180deg,#1a2540,#0d1224 70%); border:2px solid rgba(143,166,255,0.25); border-radius:8px; touch-action:none; }

  .side-controls{ display:flex; gap:8px; }
  .ctrl-btn{ width:56px; height:56px; background:#151d34; border:1px solid rgba(143,166,255,0.3); border-radius:10px; color:var(--amber); font-size:1.4rem; display:flex; align-items:center; justify-content:center; user-select:none; }
  .ctrl-btn:active{ background:rgba(232,184,75,0.25); }
  .jump-btn{ width:80px; height:56px; background:linear-gradient(180deg,#3B5FE0,#1E3A8A); border:none; border-radius:10px; color:white; font-weight:bold; font-size:0.9rem; }
  .msg-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:50; flex-direction:column; text-align:center; padding:20px; }
  .msg-overlay.show{ display:flex; }
  .msg-overlay h2{ font-family:"Courier New",monospace; margin-bottom:8px; }
  .msg-overlay button{ margin-top:16px; background:linear-gradient(180deg,#3B5FE0,#1E3A8A); color:white; border:none; padding:10px 24px; border-radius:8px; font-weight:bold; }
  footer{ text-align:center; color:#8891b3; font-size:0.65rem; opacity:0.75; padding-top:12px; line-height:1.6; }
</style>

  .wrap{ position:relative; z-index:1; }
  .back{ color:#a3aed6; text-decoration:none; border:1px solid rgba(143,166,255,.4); padding:3px 9px; border-radius:4px; font-size:.75rem; background:rgba(5,9,22,.6); }

try{ const _c = new URLSearchParams(location.search).get('char'); if(_c && /^[a-z]+$/.test(_c)){ sprite.src = 'chars-w6-' + _c + '.webp'; } }catch(e){}

// hallway background: mirrored tiles so it scrolls with no visible seam
const bgImg = new Image(); bgImg.src = 'bg-hop.webp';
let bgX = 0;
function drawBg(){
  if(!bgImg.complete || !bgImg.naturalWidth){
    ctx.fillStyle = '#1a2540'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    return;
  }
  const off = bgX % (W * 2);
  for(let k = 0; k < 4; k++){
    const x = k * W - off;
    if(x > W || x + W < 0) continue;
    ctx.save();
    if(k % 2){ ctx.translate(x + W, 0); ctx.scale(-1, 1); ctx.drawImage(bgImg, 0, 0, W, H); }
    else ctx.drawImage(bgImg, x, 0, W, H);
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(5,9,22,.22)'; ctx.fillRect(0, 0, W, H);      // keep crates and player readable
}

let player = { x: 64, y: GROUND_Y - 88, w: 74, h: 88, vy: 0, jumping: false };   // bigger, so the portrait reads clearly
const GRAVITY = 0.9;
const JUMP_V = -15;

let obstacles = [];
let speed = 5;
let frame = 0;
let score = 0;
let lives = 3;
let gameOver = false;
let invulnerable = 0;

function spawnObstacle(){
  const h = 40 + Math.random()*40;
  obstacles.push({ x: W + 20, y: GROUND_Y - h, w: 34, h: h });
}

function jump(){
  if(gameOver) return;
  if(!player.jumping){
    player.vy = JUMP_V;
    player.jumping = true;
  }
}

document.getElementById('jumpBtn').addEventListener('click', jump);
document.addEventListener('keydown', (e) => {
  if(e.code === 'Space' || e.key === 'ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
canvas.addEventListener('mousedown', jump);

function rectsOverlap(a, b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function update(){
  if(gameOver) return;
  frame++;
  bgX += speed * 0.35;
  score = Math.floor(frame/6);
  document.getElementById('score').textContent = score;

  player.vy += GRAVITY;
  player.y += player.vy;
  if(player.y >= GROUND_Y - player.h){
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    player.jumping = false;
  }

  if(frame % Math.max(40, 70-Math.floor(speed*3)) === 0) spawnObstacle();

  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  if(invulnerable > 0) invulnerable--;

  obstacles.forEach(o => {
    const playerBox = { x: player.x+14, y: player.y+12, w: player.w-28, h: player.h-12 };
    if(rectsOverlap(playerBox, o) && invulnerable === 0){
      lives--;
      document.getElementById('lives').textContent = lives;
      invulnerable = 60;
      if(lives <= 0){ endGame(); }
    }
  });

  speed = 5 + Math.min(5, frame/600);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // background + ground line
  drawBg();
  ctx.strokeStyle = 'rgba(127,233,255,0.35)';
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();

  // obstacles (SYSTEM crates)
  obstacles.forEach(o => {
    ctx.fillStyle = '#3a2f18';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = '#c97f12';
    ctx.strokeRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#c97f12';
    ctx.font = '9px monospace';
    ctx.fillText('LOCK', o.x+2, o.y+o.h/2);
  });

  // player
  ctx.save();
  if(invulnerable > 0 && Math.floor(invulnerable/6)%2===0) ctx.globalAlpha = 0.3;
  if(sprite.complete){ ctx.shadowColor = 'rgba(127,233,255,.85)'; ctx.shadowBlur = 10; ctx.drawImage(sprite, player.x, player.y, player.w, player.h); }
  ctx.restore();
}

function loop(){
  update();
  draw();
  if(!gameOver) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function endGame(){
  gameOver = true;
  document.getElementById('msgTitle').textContent = 'BLUE SCREEN';
  document.getElementById('msgTitle').style.color = '#ff3b6e';
  document.getElementById('msgText').textContent = 'WORLD_03.EXE has stopped responding. Score: ' + score;
  document.getElementById('msgOverlay').classList.add('show');
}
document.getElementById('msgBtn').addEventListener('click', () => location.reload());
