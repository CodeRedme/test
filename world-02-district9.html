    <h2>SECTOR 02 &mdash; DISTRICT 9</h2>
    <p>Security lasers seal the facility. Slip through the gaps and grab every keycard before the alarm crashes the sector.</p>
    <p style="color:#ffd166">Arrow keys / A D &middot; or tap the left/right half of the screen</p>

<script src="common.js"></script>
<script>
const stage = document.getElementById('stage');
SKZ.fit(document.querySelector('.stagewrap'));
window.addEventListener('resize', ()=>SKZ.fit(document.querySelector('.stagewrap')));

const HAZARD_MODE = "laser"; // 'laser' or 'sprite'
const W = 360, H = 640;
let player = { x: W/2-18, y: H-110, w:36, vx:0 };
let hazards = [], collects = [];
let hearts = 3, keys = 0, speed = 2.6, spawnTimer = 0, running = false, loopHandle = null;

const heartsEl = document.getElementById('heartsDisplay');
const keysEl = document.getElementById('keysDisplay');
const playerEl = document.getElementById('player');

function paintHUD(){
  heartsEl.innerHTML = '&hearts; '.repeat(Math.max(hearts,0)).trim();
  keysEl.textContent = 'KEYCARDS ' + keys;
}

function reset(){
  player = { x: W/2-18, y: H-110, w:36, vx:0 };
  hazards = []; collects = []; hearts = 3; keys = 0; speed = 2.6; spawnTimer = 0;
  paintHUD();
}

function spawnLaser(){
  const gapW = 90 + Math.random()*50;
  const gapX = Math.random() * (W - gapW);
  const el = document.createElement('div'); el.className='laser'; el.style.top='-2%'; stage.appendChild(el);
  const el2 = document.createElement('div'); el2.className='laser'; el2.style.top='-2%'; stage.appendChild(el2);
  hazards.push({ type:'laser', y:-20, gapX, gapW, el, el2 });
}
function spawnSprite(){
  const x = 15 + Math.random()*(W-30);
  const img = document.createElement('img'); img.src = ''; img.className='hazard'; img.style.top='-10%';
  stage.appendChild(img);
  hazards.push({ type:'sprite', x, y:-40, w:44, el:img });
}
function spawnWave(){
  if(HAZARD_MODE === 'laser') spawnLaser(); else spawnSprite();

    img.className = 'collect';

    const cx = 15 + Math.random()*(W-30);
    stage.appendChild(img);
    collects.push({ x:cx, y:-30, el:img });
  }
}

const held = { left:false, right:false };
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') held.left = true;
  if(e.key==='ArrowRight'||e.key==='d') held.right = true;
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') held.left = false;
  if(e.key==='ArrowRight'||e.key==='d') held.right = false;
});
document.getElementById('tzLeft').addEventListener('pointerdown', ()=>held.left = true);
document.getElementById('tzRight').addEventListener('pointerdown', ()=>held.right = true);
window.addEventListener('pointerup', ()=>{ held.left=false; held.right=false; });

function pctX(x){ return (x / W * 100) + '%'; }
function pctY(y){ return (y / H * 100) + '%'; }

function hit(){
  SKZ.shake(stage);
  SKZ.burst(stage, player.x+player.w/2, player.y, { color:'#ff5fa2', count:14 });
  SKZ.sfx.bad();
  hearts--;
  paintHUD();
  if(hearts <= 0) endRun();
}

function endRun(){
  running = false;
  if(loopHandle) loopHandle.stop();
  const grade = keys>=12?'S':keys>=8?'A':keys>=4?'B':'C';
  SKZ.results(stage, {
    title: hearts<=0 ? 'SYSTEM CRASH' : 'SECTOR STABILIZED',
    grade,
    stats: [{label:'KEYCARDS collected', value: keys}],
    buttons: [
      { label:'RETRY', fn: startRun },
      { label:'OVERWORLD', href:'index.html', primary:true }
    ]
  });
}

function startRun(){
  SKZ.hideOverlay(stage);
  document.getElementById('brief').classList.add('hidden');
  hazards.forEach(h=>{ h.el.remove(); if(h.el2) h.el2.remove(); });
  collects.forEach(c=>c.el.remove());
  reset();
  running = true;
  spawnWave();
  if(loopHandle) loopHandle.stop();
  loopHandle = SKZ.loop(step);
}

function step(dt){
  const accel = 60;
  if(held.left) player.vx -= accel*dt;
  if(held.right) player.vx += accel*dt;
  player.vx *= 0.86;
  player.x += player.vx;
  player.x = Math.max(4, Math.min(W-player.w-4, player.x));
  playerEl.style.left = pctX(player.x);
  playerEl.style.top = pctY(player.y);

  spawnTimer += dt*60;
  if(spawnTimer > Math.max(40, 75 - keys*2)){ spawnWave(); spawnTimer = 0; }

  for(const h of hazards){
    h.y += speed;
    if(h.type === 'laser'){
      h.el.style.top = pctY(h.y); h.el.style.left = '0'; h.el.style.width = pctX(h.gapX);
      h.el2.style.top = pctY(h.y); h.el2.style.left = pctX(h.gapX + h.gapW); h.el2.style.width = pctX(W - (h.gapX+h.gapW));
      if(h.y < player.y+70 && h.y > player.y-10){
        if(player.x < h.gapX || player.x+player.w > h.gapX+h.gapW){
          if(!h.hitDone){ h.hitDone = true; hit(); }
        }
      }
    } else {
      h.el.style.top = pctY(h.y); h.el.style.left = pctX(h.x);
      const dx = h.x - (player.x+player.w/2), dy = h.y - (player.y+35);
      if(Math.hypot(dx,dy) < 34 && !h.hitDone){ h.hitDone = true; hit(); }
    }
  }
  hazards = hazards.filter(h=>{
    if(h.y > H+30){ h.el.remove(); if(h.el2) h.el2.remove(); return false; }
    return true;
  });

  for(const c of collects){
    c.y += speed;
    c.el.style.top = pctY(c.y);
    c.el.style.left = pctX(c.x);
    const dx = c.x - (player.x+player.w/2), dy = c.y - (player.y+35);
    if(Math.hypot(dx,dy) < 32 && !c.got){
      c.got = true;
      keys++;
      paintHUD();
      SKZ.burst(stage, c.x, c.y, { color:'#35e0d0', count:10 });
      SKZ.sfx.good();
    }
  }
  collects = collects.filter(c=>{
    if(c.got || c.y > H+20){ c.el.remove(); return false; }
    return true;
  });

  speed = Math.min(6, speed + 0.0008);
  if(!running && loopHandle) loopHandle.stop();
}

document.getElementById('startBtn').addEventListener('click', startRun);
paintHUD();
</script>
