<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campaign Game | SYSTEM ERROR</title>
<style>
@font-face{font-family:Pixel;src:url('PressStart2P.woff2')}@font-face{font-family:Term;src:url('VT323.woff2')}
:root{--accent:#35e0d0;--ink:#effaff;--panel:rgba(5,12,30,.94)}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050916;color:var(--ink);font-family:Term,Consolas,monospace;overflow-x:hidden}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#172748,#050916 70%)}
#app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px clamp(10px,3vw,32px) 26px;gap:10px}
.topbar{width:min(1120px,100%);display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:Pixel,monospace;font-size:10px}
.topbar a,.pixel-btn{display:inline-flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;background:#101b38;border:2px solid #42577d;padding:10px 12px;cursor:pointer;font:inherit}
.topbar a:hover,.pixel-btn:hover{border-color:var(--accent);color:var(--accent)}
#world-label{color:var(--accent);text-align:center;line-height:1.5}.top-actions{display:flex;gap:8px}
#hud{width:min(1120px,100%);display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;font-family:Pixel,monospace;font-size:9px}
.hud-box{min-height:40px;padding:9px 10px;background:rgba(7,13,30,.9);border:1px solid #324567;box-shadow:0 0 10px #0008}.hud-box b{color:var(--accent)}
#objective{width:min(1120px,100%);font-size:19px;color:#d8e9fa;text-align:center;min-height:25px}
#controls-live{width:min(1120px,100%);padding:8px 12px;text-align:center;font:14px Term,monospace;color:#aeeff1;background:#09152be8;border:1px solid #30466a}
#stage{position:relative;width:min(1120px,100%);background:#071326;border:3px solid var(--accent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 33%,transparent);overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;image-rendering:pixelated;touch-action:none}
#prompt{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 10px;background:#050a1dcc;color:#fff;font-size:16px;white-space:nowrap;pointer-events:none;text-shadow:0 0 8px var(--accent)}
#mobile-controls{display:none;width:min(700px,100%);justify-content:center;gap:8px;flex-wrap:wrap}
#mobile-controls button{min-width:62px;min-height:50px;padding:8px;background:#111d38;border:2px solid #405879;color:var(--ink);font:16px Pixel,monospace;touch-action:none}
#mobile-controls button:active{background:var(--accent);color:#071326}
#intro,#result{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,#172d53ee,#030713fa 75%);overflow:auto}
.card{position:relative;width:min(980px,100%);min-height:min(600px,90dvh);display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;padding:clamp(16px,4vw,38px);border:2px solid var(--accent);background:linear-gradient(145deg,#07142beF,#0a1029f5);box-shadow:0 0 30px color-mix(in srgb,var(--accent) 40%,transparent);animation:card-in .65s cubic-bezier(.18,.8,.3,1) both}
.card:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#73e9ff0c 4px,transparent 5px);z-index:3}
@keyframes card-in{0%{opacity:0;transform:translateY(24px) scale(.94);filter:brightness(2)}100%{opacity:1;transform:none;filter:none}}
.art-frame{height:min(66dvh,500px);min-height:280px;position:relative;display:grid;place-items:center;overflow:hidden;border:1px solid #4c658e;background:#08162e;isolation:isolate}
.roster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32;filter:saturate(.75);mix-blend-mode:screen;animation:roster-in 1s ease both}
@keyframes roster-in{from{opacity:0;transform:scale(1.12)}to{opacity:.32;transform:scale(1)}}
.world-echo{position:absolute;right:0;bottom:0;height:95%;max-width:70%;object-fit:contain;opacity:.18;filter:blur(1px) drop-shadow(0 0 20px var(--accent));transform:translateX(8%);animation:echo 1.1s ease-out both}
@keyframes echo{from{opacity:0;transform:translateX(20%)}to{opacity:.18;transform:translateX(8%)}}
.hero{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 15px color-mix(in srgb,var(--accent) 60%,transparent));animation:hero-reveal .9s steps(9) both}
@keyframes hero-reveal{0%{opacity:0;transform:translateY(18px) scale(.95);clip-path:inset(0 0 85% 0);filter:brightness(3) hue-rotate(80deg)}48%{opacity:1;clip-path:inset(0);filter:brightness(1.6) drop-shadow(-4px 0 #ff5fb0)}75%{transform:translateX(4px);filter:drop-shadow(4px 0 var(--accent))}100%{transform:none;filter:drop-shadow(0 0 15px color-mix(in srgb,var(--accent) 60%,transparent))}}
.intro-copy{position:relative;z-index:4}.eyebrow{color:var(--accent);font:10px Pixel,monospace;letter-spacing:.14em}.intro-copy h1{font:clamp(18px,3vw,28px)/1.55 Pixel,monospace;margin:14px 0 8px}.intro-copy h2{font:25px Term,monospace;color:var(--accent);margin:0 0 12px}.intro-copy p{font-size:21px;line-height:1.25;margin:9px 0;color:#d7e8fa}.intro-copy .controls-copy{color:#a8c0dd;font-size:18px}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.buttons .pixel-btn{font:10px Pixel,monospace;padding:14px 16px;color:#071326;background:var(--accent);border-color:var(--accent)}.buttons .pixel-btn.secondary{color:var(--ink);background:#101b38;border-color:#42577d}
.spark{position:absolute;width:8px;height:8px;background:#a2fbff;box-shadow:0 0 14px var(--accent);animation:spark 1.2s ease-in-out infinite alternate;z-index:5}.spark.s1{left:8%;top:12%}.spark.s2{right:13%;top:24%;animation-delay:.2s}.spark.s3{left:18%;bottom:14%;animation-delay:.55s}@keyframes spark{to{transform:translateY(-15px) rotate(45deg);opacity:.35}}
#result[hidden],#intro[hidden]{display:none}
.result-card{width:min(760px,100%);padding:clamp(18px,5vw,42px);text-align:center;border:2px solid var(--accent);background:var(--panel);box-shadow:0 0 38px #35e0d055;animation:card-in .5s ease both}
.result-card h1{font:clamp(20px,4vw,34px)/1.5 Pixel,monospace;color:var(--accent)}.grade{font:72px Pixel,monospace;color:#ffe27a;text-shadow:0 0 20px #ffe27a}.result-card p{font:24px Term,monospace;line-height:1.35;color:#dbeafa}.final-rosters{display:flex;justify-content:center;gap:12px;margin:14px auto;max-height:150px}.final-rosters img{max-width:44%;height:140px;object-fit:contain;border:1px solid #3b5276;background:#101b38}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#050916eF;border:1px solid var(--accent);font-size:18px;z-index:20;opacity:0;transition:opacity .16s;pointer-events:none}#toast.show{opacity:1}
@media(max-width:700px){#app{padding:8px 8px 18px}.topbar{font-size:8px}.topbar a,.pixel-btn{padding:8px}.topbar .top-actions{gap:4px}#hud{grid-template-columns:repeat(2,1fr);font-size:8px}.hud-box{min-height:34px;padding:7px}#objective{font-size:17px}.card{grid-template-columns:1fr;gap:12px;min-height:auto;padding:14px}.art-frame{height:38dvh;min-height:210px}.intro-copy h1{font-size:16px;margin:8px 0}.intro-copy h2{font-size:21px;margin:0 0 6px}.intro-copy p{font-size:18px;margin:5px 0}.intro-copy .controls-copy{font-size:16px}.buttons{margin-top:10px}.buttons .pixel-btn{font-size:8px;padding:12px}.spark{display:none}#mobile-controls{display:flex}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar"><a href="index.html#select">◀ HUB</a><span id="world-label"></span><div class="top-actions"><button id="pause" class="pixel-btn" type="button">PAUSE</button><a href="index.html#select">EXIT</a></div></header>
  <div id="hud"><div class="hud-box"><b>MISSION</b> <span id="hud-game"></span></div><div class="hud-box"><b>HEALTH</b> <span id="hud-health"></span></div><div class="hud-box"><b>PROGRESS</b> <span id="hud-progress"></span></div><div class="hud-box"><b>TIME</b> <span id="hud-time"></span></div></div>
  <div id="objective"></div>
  <div id="controls-live" aria-label="Current game controls"></div>
  <section id="stage"><canvas id="game" width="960" height="600" tabindex="0" aria-label="Game canvas"></canvas><div id="prompt"></div></section>
  <nav id="mobile-controls" aria-label="Touch controls"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="jump">JUMP</button><button data-key="action">ACTION</button><button data-key="phase">PHASE</button><button data-key="fire">FIRE</button></nav>
</div>
<div id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title"><div class="card"><div class="art-frame"><img id="roster-art" class="roster" alt=""><img id="world-echo" class="world-echo" alt=""><img id="hero-art" class="hero" alt=""><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></div><div class="intro-copy"><div class="eyebrow">SYSTEM LINK · CHARACTER INTRO</div><h1 id="intro-title"></h1><h2 id="intro-member"></h2><p id="intro-goal"></p><p class="controls-copy" id="intro-controls"></p><div class="buttons"><button id="begin" class="pixel-btn" type="button">BEGIN MISSION</button><a class="pixel-btn secondary" href="index.html#select">BACK TO HUB</a></div></div></div></div>
<div id="result" hidden role="dialog" aria-modal="true"><div class="result-card"><div class="eyebrow" id="result-kicker">MISSION RESULT</div><h1 id="result-title"></h1><div class="grade" id="result-grade"></div><p id="result-copy"></p><div class="final-rosters" id="final-rosters" hidden><img alt="Final roster art 8"><img alt="Final roster art 9"></div><div class="buttons" style="justify-content:center"><button id="retry" class="pixel-btn" type="button">RETRY</button><button id="continue" class="pixel-btn" type="button">CONTINUE</button><a class="pixel-btn secondary" href="index.html#select">HUB</a></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="campaign-data.js"></script><script src="campaign.js"></script>
</body></html>
