<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ATE | SYSTEM ERROR</title>
<style>
  :root{ --amber:#E8B84B; --glitch:#ff3b6e; --wall:#2a3a6e; --path:#0d1224; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#050814; color:#fff; font-family:"Segoe UI",Arial,sans-serif; overflow:hidden; }
  .wrap{ max-width:480px; margin:0 auto; padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px)); padding-top:calc(12px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; height:100vh; }
  .hud{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:"Courier New",monospace; font-size:0.85rem; }
  .hud .title{ color:var(--amber); font-weight:bold; letter-spacing:1px; }
  .maze{
    display:grid; gap:0; background:var(--path); border:3px solid var(--wall); border-radius:6px;
    aspect-ratio:1; width:100%; position:relative; overflow:hidden;
  }
  .cell{ position:relative; background:var(--path); }
  .cell.wall{ background:var(--wall); }
  .pellet{ position:absolute; top:50%; left:50%; width:14%; height:14%; background:var(--amber); border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 4px var(--amber); }
  .sprite{ position:absolute; width:88%; height:88%; top:6%; left:6%; transition:left 0.12s linear, top 0.12s linear; z-index:5; }
  .sprite img{ width:100%; height:100%; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }
  .enemy{ position:absolute; width:80%; height:80%; top:10%; left:10%; transition:left 0.16s linear, top 0.16s linear; z-index:4; }
  .enemy-glyph{
    width:100%; height:100%; background:
      radial-gradient(circle at 50% 40%, #ff5c8a, #8a0033 70%);
    clip-path: polygon(50% 0%, 80% 20%, 100% 50%, 80% 80%, 50% 100%, 20% 80%, 0% 50%, 20% 20%);
    animation: glitchpulse 0.5s infinite alternate;
  }
  @keyframes glitchpulse{ from{ filter:hue-rotate(0deg);} to{ filter:hue-rotate(30deg);} }

  .controls{ display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:4px; justify-content:center; margin-top:14px; }
  .ctrl-btn{ background:#151d34; border:1px solid rgba(143,166,255,0.3); border-radius:8px; color:var(--amber); font-size:1.3rem; display:flex; align-items:center; justify-content:center; }
  .ctrl-btn:active{ background:rgba(232,184,75,0.25); }

  .msg-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:50; flex-direction:column; text-align:center; padding:20px;
  }
  .msg-overlay.show{ display:flex; }
  .msg-overlay h2{ font-family:"Courier New",monospace; margin-bottom:8px; }
  .msg-overlay button{ margin-top:16px; background:linear-gradient(180deg,#3B5FE0,#1E3A8A); color:white; border:none; padding:10px 24px; border-radius:8px; font-weight:bold; }
  footer{ text-align:center; color:#8891b3; font-size:0.65rem; opacity:0.75; padding-top:10px; line-height:1.6; }
</style>
<style>
  /* ATE background art (bg-ate.webp) */
  html,body{ background:#050a12 url("bg-ate.webp") center/cover no-repeat fixed; }
  body::before{ content:""; position:fixed; inset:0; background:rgba(3,8,16,.8); z-index:0; pointer-events:none; }
  .wrap{ position:relative; z-index:1; }
  .maze{ background:#050a12 url("bg-ate.webp") center/100% 100% no-repeat; border-color:#35e0d0; box-shadow:0 0 18px rgba(53,224,208,.35), inset 0 0 30px rgba(0,0,0,.5); }
  .cell{ background:rgba(3,9,16,.42); }
  .back{ color:#a3aed6; text-decoration:none; border:1px solid rgba(143,166,255,.4); padding:3px 9px; border-radius:4px; font-size:.75rem; background:rgba(5,9,22,.6); }
  .back:hover{ color:#fff; border-color:#fff; }
  .msg-overlay{ background:rgba(3,6,16,.5) !important; backdrop-filter:blur(2px); }
  .msg-overlay h2{ font-size:1.8rem; }
  .msg-overlay a.ov-back{ margin-top:10px; color:#a3aed6; font-size:.85rem; text-decoration:underline; }
  /* keep the maze square: it used to get squashed on short screens, which shrank the player */
  .maze{ flex:none; width:min(100%, calc(100dvh - 300px)); min-width:260px; margin:0 auto; }
  .sprite img{ filter:drop-shadow(0 0 3px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.75)); }
  .cell.wall{ background:rgba(14,52,64,.9); box-shadow:inset 0 0 0 1px rgba(53,224,208,.55), inset 0 0 7px rgba(53,224,208,.4); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <a class="back" href="index.html#select">◀ Menu</a>
    <div class="title">SYSTEM MAZE</div>
    <div>FRAGMENTS: <span id="score">0</span>/<span id="total">0</span></div>
    <div>LIVES: <span id="lives">3</span></div>
  </div>
  <div class="maze" id="maze"></div>
  <div class="controls">
    <div></div><div class="ctrl-btn" data-dir="up">▲</div><div></div>
    <div class="ctrl-btn" data-dir="left">◀</div><div class="ctrl-btn" data-dir="down">▼</div><div class="ctrl-btn" data-dir="right">▶</div>
  </div>
  <footer>
    Game concept, original artwork, programming, level design &amp; development — Tulika / @minberrydiary<br>
    Unofficial Stray Kids fan project. Not affiliated with JYP Entertainment or Stray Kids.
  </footer>
</div>

<div class="msg-overlay" id="msgOverlay">
  <h2 id="msgTitle"></h2>
  <p id="msgText" style="color:#8891b3; font-size:0.85rem;"></p>
  <button id="msgBtn">Restart</button>
  <a class="ov-back" href="index.html#select">Back to menu</a>
</div>

<script>
// 0 = wall, 1 = path with pellet, 2 = path no pellet
const LAYOUT = [
"1111111111111",
"1000010000001",
"1011010111101",
"1010000010001",
"1010110110101",
"1000100010001",
"1110101100011",
"1000100010001",
"1010110110101",
"1010000010001",
"1011010111101",
"1000010000001",
"1111111111111"
];
const ROWS = LAYOUT.length, COLS = LAYOUT[0].length;
const mazeEl = document.getElementById('maze');
mazeEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
mazeEl.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;

let grid = [];
let pelletCount = 0;
for(let r=0;r<ROWS;r++){
  const row = [];
  for(let c=0;c<COLS;c++){
    const ch = LAYOUT[r][c];
    const cell = document.createElement('div');
    cell.className = 'cell' + (ch === '1' ? ' wall' : '');
    mazeEl.appendChild(cell);
    let hasPellet = (ch === '0');
    if(hasPellet){
      const p = document.createElement('div');
      p.className = 'pellet';
      cell.appendChild(p);
      pelletCount++;
    }
    row.push({ wall: ch === '1', pellet: hasPellet, el: cell });
  }
  grid.push(row);
}
document.getElementById('total').textContent = pelletCount;

const player = { r:1, c:1, el:null };
const spriteWrap = document.createElement('div');

// hub: use the player picked on the title screen (falls back to the built-in sprite)
try{ const _c = new URLSearchParams(location.search).get('char'); if(_c && /^[a-z]+$/.test(_c)){ const _i = spriteWrap.querySelector('img'); if(_i) _i.src = 'chars-w5-' + _c + '.webp'; } }catch(e){}

const enemies = [
  { r:6, c:6, el:null, dir:{dr:0,dc:1} },
  { r:11, c:11, el:null, dir:{dr:0,dc:-1} }
];
enemies.forEach(en => {
  const e = document.createElement('div');
  e.className = 'enemy';
  e.innerHTML = '<div class="enemy-glyph"></div>';
  mazeEl.appendChild(e);
  en.el = e;
});

let score = 0, lives = 3, gameOver = false;

function cellPercent(r, c){
  return { top: (r * 100 / ROWS) + '%', left: (c * 100 / COLS) + '%' };
}

function positionSprite(el, r, c){
  const pos = cellPercent(r,c);
  el.style.top = pos.top;
  el.style.left = pos.left;
  // the player is drawn bigger than one cell so the portrait reads clearly; enemies a little bigger too
  const k = el.classList.contains('enemy') ? 1.15 : 1.5;
  const cw = 100 / COLS, ch = 100 / ROWS;
  el.style.boxSizing = 'border-box';
  el.style.padding = '0';
  el.style.width = (cw * k) + '%';
  el.style.height = (ch * k) + '%';
  el.style.left = (c * cw - cw * (k - 1) / 2) + '%';
  el.style.top = (r * ch - ch * (k - 1) / 2) + '%';
}

function updatePlayerVisual(){
  positionSprite(player.el, player.r, player.c);
}
function updateEnemyVisual(en){
  positionSprite(en.el, en.r, en.c);
}
updatePlayerVisual();
enemies.forEach(updateEnemyVisual);

function tryMove(dr, dc){
  if(gameOver) return;
  const nr = player.r + dr, nc = player.c + dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(grid[nr][nc].wall) return;
  player.r = nr; player.c = nc;
  updatePlayerVisual();
  const cell = grid[nr][nc];
  if(cell.pellet){
    cell.pellet = false;
    cell.el.querySelector('.pellet')?.remove();
    score++;
    document.getElementById('score').textContent = score;
    if(score >= pelletCount) winGame();
  }
  checkCollision();
}

function checkCollision(){
  enemies.forEach(en => {
    if(en.r === player.r && en.c === player.c) hitEnemy();
  });
}

function hitEnemy(){
  if(gameOver) return;
  lives--;
  document.getElementById('lives').textContent = lives;
  if(lives <= 0){ loseGame(); }
  else {
    player.r = 1; player.c = 1;
    updatePlayerVisual();
  }
}

function winGame(){
  gameOver = true;
  showMsg('MEMORY RESTORED', 'All fragments recovered. World stability improving.', true);
}
function loseGame(){
  gameOver = true;
  showMsg('CONNECTION LOST', 'The Glitch Spikes caught you. Try again.', false);
}
function showMsg(title, text, won){
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgTitle').style.color = won ? '#7fffb0' : '#ff3b6e';
  document.getElementById('msgText').textContent = text;
  document.getElementById('msgOverlay').classList.add('show');
}

document.getElementById('msgBtn').addEventListener('click', () => location.reload());

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowUp' || e.key === 'w') tryMove(-1,0);
  else if(e.key === 'ArrowDown' || e.key === 's') tryMove(1,0);
  else if(e.key === 'ArrowLeft' || e.key === 'a') tryMove(0,-1);
  else if(e.key === 'ArrowRight' || e.key === 'd') tryMove(0,1);
});
document.querySelectorAll('.ctrl-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const dir = btn.dataset.dir;
    if(dir==='up') tryMove(-1,0);
    if(dir==='down') tryMove(1,0);
    if(dir==='left') tryMove(0,-1);
    if(dir==='right') tryMove(0,1);
  });
});

function randomStep(en){
  const options = [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];
  const valid = options.filter(o => {
    const nr = en.r+o.dr, nc = en.c+o.dc;
    return nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!grid[nr][nc].wall;
  });
  if(valid.length === 0) return;
  // bias toward continuing same direction if possible
  let choice;
  const sameDir = valid.find(o => o.dr===en.dir.dr && o.dc===en.dir.dc);
  if(sameDir && Math.random() < 0.6) choice = sameDir;
  else choice = valid[Math.floor(Math.random()*valid.length)];
  en.dir = choice;
  en.r += choice.dr; en.c += choice.dc;
  updateEnemyVisual(en);
}

setInterval(() => {
  if(gameOver) return;
  enemies.forEach(randomStep);
  checkCollision();
}, 450);
</script>
  <script src="music.js"></script>
</body>
</html>
